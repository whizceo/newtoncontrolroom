<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Newton Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#060607;--ink:#f3efeb;--ink2:#cfc9c4;--mute:#8e8882;--dim:#55504c;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.14);
  --sig:#e42b0c;--amber:#ff8a3d;--gold:#ffc38a;--ok:#5fd39a;--err:#ff5a4f;--side:252px;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'Inter',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}

/* control-room backdrop: vermillion bloom, floor grid, one light beam */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1100px 620px at 22% -14%,rgba(228,43,12,.22),transparent 60%),
             radial-gradient(900px 520px at 104% 108%,rgba(255,138,61,.10),transparent 60%),#060607}
.bgfx::before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 45% 0%,#000 15%,transparent 72%);mask-image:radial-gradient(ellipse at 45% 0%,#000 15%,transparent 72%)}
.bgfx::after{content:'';position:absolute;top:-40%;left:38%;width:240px;height:180%;
  background:linear-gradient(90deg,transparent,rgba(255,120,70,.075),transparent);transform:rotate(26deg);filter:blur(34px)}

.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100vh}

/* ---------- sidebar ---------- */
.side{height:100vh;overflow-y:auto;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 16px;
  background:linear-gradient(180deg,rgba(20,14,12,.78),rgba(8,8,9,.78));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.brand{display:flex;gap:12px;align-items:center;padding:2px 8px 20px}
.mark{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;font:600 15px var(--sans);color:#fff;
  background:radial-gradient(circle at 30% 22%,#ff9a70,#e42b0c 55%,#6d1204);box-shadow:0 0 26px rgba(228,43,12,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.bn{font-weight:500;font-size:14.5px;letter-spacing:-.01em}
.bs{font:9.5px var(--mono);color:var(--mute);letter-spacing:.16em;text-transform:uppercase}
.grp{font:9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);padding:16px 10px 7px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;margin:1px 0;border-radius:10px;color:var(--mute);text-decoration:none;font-size:13px;position:relative;transition:color .2s,background .2s}
.nav a svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav a:hover{color:var(--ink);background:rgba(255,255,255,.035)}
.nav a::after{content:'';position:absolute;inset:0;border-radius:10px;pointer-events:none;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.12) 45%,rgba(228,43,12,.22) 52%,transparent 62%) no-repeat;background-size:250% 100%;background-position:150% 0;opacity:0}
.nav a:hover::after{animation:navsweep .75s ease-out}
@keyframes navsweep{from{background-position:150% 0;opacity:1}to{background-position:-50% 0;opacity:1}}
.nav a.on{color:#fff;background:linear-gradient(90deg,rgba(228,43,12,.24),rgba(228,43,12,.03));box-shadow:inset 0 0 0 1px rgba(228,43,12,.28)}
.nav a.on::before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--sig);box-shadow:0 0 14px var(--sig)}
.nav a .d{margin-left:auto}
.d{width:6px;height:6px;border-radius:50%;background:var(--dim);display:inline-block;flex:none}
.d.live{background:var(--ok);box-shadow:0 0 8px var(--ok)}.d.man{background:var(--amber)}.d.err{background:var(--err);box-shadow:0 0 8px var(--err)}
.sidefoot{margin-top:auto;padding-top:18px}
.mach{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:rgba(255,255,255,.025)}
.mach .kl{margin-bottom:6px}
.mach b{display:block;font-weight:400;font-size:13px}
.mach span{color:var(--mute);font-size:11.5px}
.demolink{display:block;margin-top:10px;font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-decoration:none;padding:0 4px}
.demolink:hover{color:var(--amber)}

/* ---------- main ---------- */
.main{height:100vh;overflow-y:auto;overflow-x:hidden}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:16px 28px;
  background:linear-gradient(180deg,rgba(6,6,7,.92),rgba(6,6,7,.6));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.crumb{font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
h1{font-weight:300;font-size:25px;letter-spacing:-.025em;line-height:1.2}
.tr{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{font:10.5px var(--mono);padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--mute);white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.pill.demo{color:var(--amber);border-color:rgba(255,138,61,.4)}
#view{padding:22px 28px 64px}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.col>.glass:last-child{flex:1}

/* ---------- glass ---------- */
.glass{position:relative;border-radius:18px;min-width:0;
  background:linear-gradient(180deg,rgba(255,255,255,.052),rgba(255,255,255,.014));border:1px solid var(--line);
  backdrop-filter:blur(16px) saturate(130%);-webkit-backdrop-filter:blur(16px) saturate(130%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 28px 60px -32px rgba(0,0,0,.95);
  animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .25s}
.glass::before{content:'';position:absolute;top:-1px;left:14%;right:14%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,150,110,.55),transparent);opacity:.75}
.glass::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(440px circle at var(--mx,-999px) var(--my,-999px),rgba(228,43,12,.085),transparent 45%)}
.glass:hover{border-color:rgba(255,255,255,.12)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.panel{padding:18px 20px 20px}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.ph h3{font-weight:400;font-size:14.5px;letter-spacing:-.005em}
.ph p{color:var(--mute);font-size:12px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:7px;font:9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);
  padding:5px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;background:rgba(0,0,0,.28);flex:none}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.chip.live i{background:var(--ok);box-shadow:0 0 8px var(--ok)}.chip.man i{background:var(--amber)}.chip.err i{background:var(--err)}
.kl{font:9.5px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--mute)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 16px 12px;min-height:140px;display:flex;flex-direction:column;transform-style:preserve-3d;will-change:transform}
.kv{font-weight:300;font-size:32px;letter-spacing:-.035em;margin-top:9px;font-feature-settings:'tnum';line-height:1.1;transform:translateZ(24px)}
.ks{color:var(--mute);font-size:11.5px;margin-top:4px;transform:translateZ(12px)}
.spark{height:34px;margin-top:auto;padding-top:8px}
.kpi.accent{background:linear-gradient(155deg,rgba(228,43,12,.32),rgba(228,43,12,.06) 62%,rgba(255,255,255,.01));border-color:rgba(228,43,12,.4);
  box-shadow:0 0 46px -12px rgba(228,43,12,.55),inset 0 1px 0 rgba(255,190,160,.3)}
.kpi.accent .kl{color:#ffb79f}

/* ---------- charts ---------- */
.ch{height:240px;position:relative}
.ch svg,.map svg{display:block;overflow:visible}
svg text{font-family:var(--mono);font-size:9.5px;fill:var(--mute)}
svg text.bv{fill:var(--ink);font-size:10.5px}
svg text.fl{font-family:var(--sans);font-size:12px;fill:var(--ink2)}
svg text.fv{font-family:var(--sans);font-size:16px;font-weight:300;fill:#fff}
svg text.fc{fill:var(--amber);font-size:10px}
svg text.big{font-family:var(--sans);font-weight:300;fill:#fff}
.grid-l{stroke:rgba(255,255,255,.06)}
.hit{fill:transparent}.hit:hover{fill:rgba(255,255,255,.035)}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes grow{from{transform:scaleY(0)}}
.rise3{animation:rise3 .8s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise3{from{opacity:0;transform:translateY(-14px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.3);opacity:0}}
.sweep{animation:sweep 7s linear infinite}
@keyframes sweep{from{transform:translateX(-35%)}to{transform:translateX(135%)}}
.lg{display:flex;gap:16px;flex-wrap:wrap;font:10px var(--mono);letter-spacing:.06em;color:var(--mute);margin-bottom:10px;text-transform:uppercase}
.lg span{display:inline-flex;gap:7px;align-items:center}
.lg i{width:9px;height:9px;border-radius:3px;box-shadow:0 0 8px currentColor}
.map{height:440px;position:relative;perspective:1600px}
.map.big{height:600px}
.panel.fill{display:flex;flex-direction:column}.panel.fill .map{flex:1;min-height:440px}
.map>svg{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.maplg{display:flex;align-items:center;gap:10px;font:9.5px var(--mono);color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-top:6px;flex-wrap:wrap}
.maplg i{width:140px;height:6px;border-radius:6px;background:linear-gradient(90deg,rgba(228,43,12,.06),rgba(228,43,12,.85));box-shadow:0 0 10px rgba(228,43,12,.4)}
.dn{display:flex;gap:18px;align-items:center;height:100%}
.dn-c{width:170px;height:100%;min-height:150px;flex:none}
.dn .lg{flex-direction:column;gap:9px;margin:0;flex:1;min-width:0}
.dn .lg span{justify-content:space-between;gap:12px;text-transform:none;font-size:11px;letter-spacing:0}
.dn .lg b{color:var(--ink);font-weight:400;white-space:nowrap}
.ringrow{display:flex;gap:18px;align-items:center}
.ring{width:136px;height:136px;flex:none}
.srcl{display:grid;gap:7px;flex:1;min-width:0}
.srcl div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.srcl div>span:last-child{font:10px var(--mono);color:var(--dim);white-space:nowrap}

/* ---------- lists, tables ---------- */
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font:9px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--dim);text-align:left;padding:0 10px 10px;font-weight:400;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid rgba(255,255,255,.045);font-feature-settings:'tnum';white-space:nowrap}
.tbl tr:hover td{background:rgba(255,255,255,.022)}
.tbl .n{text-align:right}
.tbl td.w{white-space:normal;min-width:180px}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--sig),var(--amber));box-shadow:0 0 10px rgba(228,43,12,.7)}
.st{font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:6px;border:1px solid var(--line);color:var(--mute)}
.st.live,.st.published{color:var(--ok);border-color:rgba(95,211,154,.3)}.st.draft,.st.paused{color:var(--amber);border-color:rgba(255,138,61,.3)}
.hb{display:grid;gap:10px}
.hb .r{display:grid;grid-template-columns:118px minmax(0,1fr) 70px;gap:12px;align-items:center;font-size:12px}
.hb .r>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.hb .r>span:last-child{text-align:right;font:11px var(--mono);color:var(--mute)}
.feed{display:grid;gap:2px}
.fi{display:flex;gap:12px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12.5px}
.fi i{width:7px;height:7px;border-radius:50%;background:var(--sig);box-shadow:0 0 10px var(--sig);margin-top:6px;flex:none}
.fi span{font:10px var(--mono);color:var(--dim)}
.stat{display:grid;gap:4px}
.stat b{font-weight:300;font-size:26px;letter-spacing:-.03em;font-feature-settings:'tnum'}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:18px}
.note{color:var(--mute);font-size:12px;border-left:2px solid var(--sig);padding:2px 0 2px 12px;margin-top:14px}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.seg button{font:11px var(--mono);letter-spacing:.04em;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--mute);cursor:pointer}.seg button.on{color:#fff;border-color:var(--sig);background:rgba(228,43,12,.14)}
.empty{height:100%;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;padding:20px;
  border:1px dashed rgba(255,255,255,.11);border-radius:14px;color:var(--mute);background:repeating-linear-gradient(135deg,rgba(255,255,255,.014) 0 8px,transparent 8px 16px)}
.empty b{font-weight:400;color:var(--ink2);font-size:12.5px;max-width:360px}
.empty code{font:10px var(--mono);color:var(--amber);opacity:.9}
.inb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dom{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(0,0,0,.2);min-width:0}
.dh{font:10.5px var(--mono);color:var(--ink2);margin-bottom:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px;font:9.5px var(--mono);color:var(--mute)}
.cell em{font-style:normal;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase}
.cell em.ok{color:var(--ok)}.cell em.bad{color:var(--err)}
.intg{padding:20px}
.ih{display:flex;gap:13px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font:500 14px var(--sans);color:#fff;flex:none;
  background:radial-gradient(circle at 30% 22%,rgba(255,176,138,.9),#e42b0c 48%,#3d0c04);border:1px solid rgba(255,150,110,.5);
  box-shadow:0 0 22px -4px rgba(228,43,12,.75),inset 0 1px 1px rgba(255,255,255,.45),inset 0 -6px 12px rgba(0,0,0,.35)}
.logo.man{background:radial-gradient(circle at 30% 22%,#ffe0b8,#ff8a3d 50%,#3d1d04);box-shadow:0 0 22px -4px rgba(255,138,61,.65),inset 0 1px 1px rgba(255,255,255,.45),inset 0 -6px 12px rgba(0,0,0,.35)}
.logo.off,.logo.err{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.02));border-color:var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.hub{height:270px}.hub svg{width:100%;height:100%;display:block;overflow:visible}
.hub .spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}.hub .spin.r{animation-direction:reverse;animation-duration:26s}
@keyframes spin{to{transform:rotate(360deg)}}
.flight{height:340px}.flight svg{width:100%;height:100%;display:block;overflow:visible}
.flight text.fl{font:9.5px var(--mono);letter-spacing:.1em;fill:var(--mute)}.flight text.fp{font:10px var(--mono);fill:#ffb79f}
.flight .flow{animation:flflow 1.6s linear infinite}@keyframes flflow{to{stroke-dashoffset:-22}}
.hero{display:grid;grid-template-columns:270px minmax(0,1fr);gap:8px;align-items:center}
.hero .kl{font:10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.hero .hv{font:200 72px/1 var(--sans);letter-spacing:-.03em;margin:12px 0 10px;background:linear-gradient(180deg,#fff 20%,#ffb08a 70%,#e42b0c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(228,43,12,.55))}
.hero .ks{color:var(--mute);font-size:13px;line-height:1.5}.hero .hl{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font:11px var(--mono);color:#ffb79f;line-height:1.7}
.city{height:380px}.city svg{width:100%;height:100%;display:block;overflow:visible}
.city text.cn{font:10px var(--mono);letter-spacing:.05em;fill:var(--ink)}.city text.cs{font:8.5px var(--mono);letter-spacing:.06em;fill:var(--mute);text-transform:uppercase}
.city text.cv{font:500 13px var(--sans);fill:#ffd9b8}.city g.b{cursor:pointer;transition:filter .2s}.city g.b:hover{filter:brightness(1.35) drop-shadow(0 0 12px rgba(255,120,80,.7))}
.zig{height:330px}.zig svg{width:100%;height:100%;display:block;overflow:visible}.zig text.zl{font:9.5px var(--mono);letter-spacing:.1em;fill:var(--mute)}.zig text.zp{font:10px var(--mono);fill:#ffb79f}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}.hero .hv{font-size:54px}
  .ph{flex-wrap:wrap}.ph>div{flex:1 1 200px}.ch:has(>.dn){height:auto!important}.dn{height:auto}
  .city,.flight,.swipe{height:auto;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .city::-webkit-scrollbar,.flight::-webkit-scrollbar,.swipe::-webkit-scrollbar{display:none}
  .city svg{width:860px;height:327px}.flight svg{width:760px;height:258px}
  .zig{height:auto;overflow:hidden}.zig svg{width:150%;height:auto}.zig .lab{display:none}
  .swh{display:block}}
.swh{display:none;text-align:center;font:9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.zigl{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}.zigl div{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.zigl div.top{border-color:rgba(255,195,138,.55);background:linear-gradient(160deg,rgba(255,195,138,.14),rgba(228,43,12,.05))}
.zigl b{display:block;font:300 24px var(--sans)}.zigl span{display:block;font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:3px}.zigl em{display:block;font:normal 10px var(--mono);color:#ffb79f;margin-top:4px}
@media (max-width:900px){.zigl{display:grid}}
.hub text.nn{font-family:var(--sans);font-size:13px;fill:var(--ink)}.hub text.ns{font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.ih h3{font-weight:400;font-size:15px}.ih p{font:10.5px var(--mono);color:var(--mute)}
.ih .chip{margin-left:auto}
.ep{font:10.5px var(--mono);color:var(--ink2);display:grid;gap:4px;padding:12px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--line);margin:10px 0 14px;overflow-x:auto}
.un{display:grid;gap:7px;font-size:12.5px}
.un div{display:flex;gap:10px;align-items:flex-start}
.un i{font:normal 10px var(--mono);width:18px;height:18px;border-radius:6px;display:grid;place-items:center;flex:none;margin-top:1px;border:1px solid var(--line)}
.un .on i{color:var(--ok);border-color:rgba(95,211,154,.35);background:rgba(95,211,154,.08)}
.un .wait{color:var(--mute)}.un .miss i{color:var(--err);border-color:rgba(255,90,79,.35)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:s}
.steps div{border:1px solid var(--line);border-radius:14px;padding:16px;background:rgba(0,0,0,.2)}
.steps b{display:block;font-weight:400;margin:8px 0 4px}.steps span{color:var(--mute);font-size:12px}
.steps div::before{counter-increment:s;content:'0' counter(s);font:10px var(--mono);color:var(--sig);letter-spacing:.1em}
.up{display:grid;gap:8px}
.up div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.2);font-size:12.5px}
.up span{font:11px var(--mono);color:var(--amber)}
#tip{position:fixed;left:0;top:0;z-index:50;pointer-events:none;opacity:0;transition:opacity .12s;padding:8px 11px;border-radius:10px;
  background:rgba(16,13,12,.94);border:1px solid var(--line2);font:11px var(--mono);color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.6);white-space:nowrap}
#tip b{color:#fff;font-weight:500}
.err{padding:60px;color:var(--mute)}

/* ---------- calendar ---------- */
.cbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cbar button{background:rgba(0,0,0,.25);border:1px solid var(--line2);color:var(--ink);font:12px var(--sans);padding:6px 12px;border-radius:8px;cursor:pointer}
.cbar button:hover{border-color:var(--ink2)}
.cbar>b{font-weight:400;font-size:14px;margin-left:6px}
.cbar .lg{margin-left:auto;display:flex;align-items:center;gap:7px;font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.cbar .lg i{width:8px;height:8px;border-radius:2px;margin-left:8px}
.lg i.event,.cev.event,.cli.event{background:rgba(255,255,255,.06);border-left:2px solid var(--ink2)}
.lg i.call,.cev.call,.cli.call{background:rgba(228,43,12,.16);border-left:2px solid var(--sig)}
.cal{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ch0,.chd{padding:10px 6px;border-bottom:1px solid var(--line);font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:center}
.chd b{display:block;font:300 20px var(--sans);letter-spacing:0;color:var(--ink);margin-top:2px}
.chd.now b{color:var(--sig)}
.ch0.kl{display:flex;align-items:center;justify-content:center;font-size:8.5px;letter-spacing:.06em}
.cad{border-bottom:1px solid var(--line2);border-left:1px solid var(--line);padding:3px;min-height:30px;display:grid;gap:3px;align-content:start}
.cad .cev{position:static;padding:3px 6px}
.chr div{height:var(--h);font:9.5px var(--mono);color:var(--dim);text-align:right;padding:0 8px;transform:translateY(-6px)}
.chr div:first-child{visibility:hidden}
.ccol{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--h)}
.ccol.now{background-color:rgba(228,43,12,.025)}
.cnow{position:absolute;left:0;right:0;height:1px;background:var(--sig);z-index:2}
.cnow::before{content:'';position:absolute;left:-4px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--sig)}
.cev{position:absolute;border-radius:5px;padding:4px 6px;overflow:hidden;font-size:11px;line-height:1.25;cursor:default}
.cev b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cev span{display:block;font:9.5px var(--mono);color:var(--mute);margin-top:2px;white-space:nowrap}
.clist{display:none}
.cld{padding:12px 0;border-top:1px solid var(--line)}
.cld.now .kl{color:var(--sig)}
.cld p{color:var(--dim);font-size:12px;margin-top:6px}
.cli{display:flex;gap:12px;margin-top:8px;padding:8px 10px;border-radius:6px;font-size:13px}
.cli span{font:11px var(--mono);color:var(--mute);flex:none;width:62px}
.cli b{font-weight:400}
@media (max-width:900px){.cal{display:none}.clist{display:block}.cbar .lg{display:none}}

@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.inb{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  body{overflow:auto}.app{display:block;height:auto}
  .side{position:sticky;top:0;z-index:10;height:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand,.grp,.sidefoot{display:none}.nav{display:flex;gap:2px}.nav a{white-space:nowrap}.nav a.on::before{display:none}.nav a .d{display:none}
  .main{height:auto;overflow:visible}.top{position:static;padding:16px;flex-wrap:wrap}.tr{margin-left:0;justify-content:flex-start}
  #view{padding:14px 16px 40px}.g>*{grid-column:span 12!important}
  .kpis,.kpis.k5,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.kv{font-size:26px}
  .map{height:320px}.map.big{height:380px}.steps{grid-template-columns:minmax(0,1fr)}
  .ringrow,.dn{flex-direction:column;align-items:stretch}.dn-c{width:100%;height:170px}.ring{margin:0 auto}
  .hb .r{grid-template-columns:92px minmax(0,1fr) 58px}
}

/* login gate */
.gate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg)}
.gate form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.gate .k{font:500 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--sig)}
.gate h1{font:500 22px/1.2 var(--sans);letter-spacing:-.01em}
.gate p{color:var(--mute)}
.gate input{background:transparent;border:1px solid var(--line2);color:var(--ink);font:14px var(--mono);padding:12px 14px;border-radius:6px;outline:none}
.gate input:focus{border-color:var(--ink2)}
.gate button{background:var(--ink);color:var(--bg);border:0;font:600 13px var(--sans);padding:12px;border-radius:6px;cursor:pointer}
.gate .no{color:var(--err);font:12px var(--mono);min-height:16px}
.gate.shake form{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

<body>
<div class="gate" id="gate"><form id="gf" autocomplete="on" onsubmit="return false">
  <div class="k">Newton Control Room</div>
  <h1>Enter password</h1>
  <input type="password" id="gp" autocomplete="current-password" autofocus aria-label="Password">
  <button type="submit">Open dashboard</button>

</form></div>
<div class="bgfx"></div>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">N</div><div><div class="bn">Newton</div><div class="bs">Control room</div></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main" id="main">
    <header class="top">
      <div><div class="crumb" id="crumb">Issac Newton · eXp Commercial</div><h1 id="ptitle">Overview</h1></div>
      <div class="tr"><span class="pill demo" id="demopill" hidden>Demo data · not live</span><span class="pill" id="clock"></span><span class="pill">Last 30 days</span><span class="pill" id="syncp"></span></div>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="tip"></div>
<script>
const C = {sig: '#e42b0c', amber: '#ff8a3d', gold: '#ffc38a', ink: '#f3efeb', mute: '#8e8882', dim: '#55504c', ok: '#5fd39a'};
const DEMO = false;  // never sample numbers: Issac sees real data only
const API = ['instantly', 'ghl'];
const NAMES = {instantly: 'Instantly', ghl: 'Newton CRM', content: 'LinkedIn', website: 'Website', list: 'Owner list'};
let D = null, CUR = null;

const $ = s => document.querySelector(s);
const fmt = v => v == null || isNaN(v) ? '—' : Math.round(v).toLocaleString('en-US');
const pctf = (a, b, dp = 1) => !b || a == null ? '—' : (100 * a / b).toFixed(dp) + '%';
const sum = (a, k) => (a || []).reduce((t, x) => t + (+(k ? x[k] : x) || 0), 0);
const money = v => v == null ? '—' : v >= 1e6 ? '$' + (v / 1e6).toFixed(1) + 'M' : v >= 1e3 ? '$' + Math.round(v / 1e3) + 'K' : '$' + Math.round(v);
const dshort = d => new Date(d.length > 10 ? d : d + 'T12:00').toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
const uid = () => 'u' + Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const trunc = (s, n) => s.length > n ? s.slice(0, Math.max(3, n - 1)) + '…' : s;
const ago = iso => { if (!iso) return 'never'; const m = (Date.now() - new Date(iso)) / 6e4;
  return m < 1 ? 'just now' : m < 60 ? Math.round(m) + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago' };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => '#' + hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');
const glowF = (id, sd = 4) => `<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${sd}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
const grad = (id, col, a0 = 1, a1 = .15) => `<linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity="${a0}"/><stop offset="1" stop-color="${col}" stop-opacity="${a1}"/></linearGradient>`;

/* isometric box around a base centre (bx,by): w runs ↘, d runs ↙, h up, o.z lifts it. o.l/o.r/o.t = face fills, o.win = lit windows */
const isoBox = (bx, by, w, d, h, o = {}) => { const z0 = o.z || 0, s = o.s || 'rgba(255,170,130,.35)', sw = o.sw || .6, da = o.dash ? ' stroke-dasharray="3 3"' : '';
  const P = (u, v, z) => `${(bx + (u - w / 2 - v + d / 2) * .866).toFixed(1)},${(by + (u - w / 2 + v - d / 2) * .5 - z - z0).toFixed(1)}`;
  const q = (a, b, c, e) => `<polygon points="${a} ${b} ${c} ${e}"`;
  let win = '';
  if (o.win && h > 26) { const fl = Math.floor((h - 12) / 11), seed = o.win;
    for (let f = 0; f < fl; f++) for (let j = 0; j < 3; j++) { const z1 = 8 + f * 11, lit = ((f * 7 + j * 13 + seed * 31) % 10) < 6, fill = lit ? (f % 3 ? 'rgba(255,205,160,.85)' : 'rgba(255,240,215,.95)') : 'rgba(0,0,0,.35)';
      const a = w * (j + .25) / 3, b = w * (j + .7) / 3, c = d * (j + .25) / 3, e = d * (j + .7) / 3;
      win += `${q(P(a, d, z1), P(b, d, z1), P(b, d, z1 + 5), P(a, d, z1 + 5))} fill="${fill}"/>${q(P(w, c, z1), P(w, e, z1), P(w, e, z1 + 5), P(w, c, z1 + 5))} fill="${fill}" opacity=".7"/>` } }
  return `${q(P(0, d, 0), P(w, d, 0), P(w, d, h), P(0, d, h))} fill="${o.l}" stroke="${s}" stroke-width="${sw}"${da}/>${q(P(w, 0, 0), P(w, d, 0), P(w, d, h), P(w, 0, h))} fill="${o.r}" stroke="${s}" stroke-width="${sw}"${da}/>${q(P(0, 0, h), P(w, 0, h), P(w, d, h), P(0, d, h))} fill="${o.t}" stroke="${s}" stroke-width="${sw}"${da}/>${win}` };

/* paper-plane flight: owners take off on the ground and climb to a positive reply */
function flight(m) {
  const id = uid(), G = 300, pts = [['Emails sent', m.sent, 'emails sent'], ['Delivered', m.sent - m.bounced, 'landed in an inbox'], ['Replied', m.replies, 'owners wrote back'], ['Positive', m.positive, 'owners want to talk']]
    .map((x, i) => ({l: x[0], v: x[1], s: x[2], x: 120 + i * 253, y: 238 - i * 58}));
  const curve = a => a.map((p, i) => i ? `C${a[i - 1].x + 110} ${a[i - 1].y} ${p.x - 110} ${p.y} ${p.x} ${p.y}` : `M${p.x} ${p.y}`).join(' ');
  const air = curve(pts), ground = curve(pts.map(p => ({x: p.x, y: G})));
  const plane = (dur, begin, sc, op) => `<g opacity="${op}"><g transform="scale(${sc})"><path d="M18 0L-13 -10L-6 0L-13 10Z" fill="url(#${id}w)" filter="url(#${id}g)"/><path d="M18 0L-6 0L-9 5" fill="none" stroke="#e42b0c" stroke-width="1.2"/></g><animateMotion dur="${dur}s" begin="${begin}s" repeatCount="indefinite" rotate="auto" path="${air}"/></g>`;
  return `<svg viewBox="0 0 1000 340" preserveAspectRatio="xMidYMid meet"><defs>${glowF(id + 'g', 4)}${glowF(id + 'h', 9)}
    <linearGradient id="${id}w" x1="0" x2="1"><stop offset="0" stop-color="#ffd1bc"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <linearGradient id="${id}a" x1="0" x2="1"><stop offset="0" stop-color="#e42b0c" stop-opacity=".25"/><stop offset="1" stop-color="#ffc38a"/></linearGradient>
    <linearGradient id="${id}f" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e42b0c" stop-opacity=".18"/><stop offset="1" stop-color="#e42b0c" stop-opacity="0"/></linearGradient></defs>
    <path d="M40 ${G - 18}L960 ${G - 18}L995 ${G + 30}L5 ${G + 30}Z" fill="url(#${id}f)" stroke="rgba(255,150,110,.14)"/>
    ${Array.from({length: 11}, (_, k) => `<line x1="${40 + k * 92}" y1="${G - 18}" x2="${5 + k * 99}" y2="${G + 30}" stroke="rgba(255,255,255,.04)"/>`).join('')}
    <path d="${ground}" fill="none" stroke="rgba(255,120,80,.28)" stroke-width="5" stroke-linecap="round" filter="url(#${id}h)"/>
    <path d="${air} L${pts[3].x} ${G} L${pts[0].x} ${G}Z" fill="url(#${id}f)" opacity=".55"/>
    <path d="${air}" fill="none" stroke="url(#${id}a)" stroke-width="2.4" filter="url(#${id}g)"/>
    <path d="${air}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1" stroke-dasharray="2 9" class="flow"/>
    ${pts.map((p, i) => { const top = i === 3, prev = pts[i - 1];
      return `<g data-tip="${p.l}<br>${fmt(p.v)} ${p.s}${prev ? ' · ' + pctf(p.v, prev.v) + ' of the step before' : ''}">
      <line x1="${p.x}" y1="${p.y}" x2="${p.x}" y2="${G}" stroke="rgba(255,150,110,.35)" stroke-dasharray="2 4"/>
      ${isoBox(p.x, G, 34, 34, 5, {l: '#5a1206', r: '#2a0803', t: top ? '#ffc38a' : '#e42b0c', s: 'rgba(255,170,130,.5)'})}
      <circle cx="${p.x}" cy="${p.y}" r="${top ? 9 : 6}" fill="${top ? '#ffc38a' : '#fff'}" filter="url(#${id}g)"/><circle cx="${p.x}" cy="${p.y}" r="10" fill="none" stroke="${top ? '#ffc38a' : '#ff8a5c'}" class="pulse"/>
      <text x="${p.x}" y="${p.y - 46}" text-anchor="middle" class="big rise3" style="font-size:${top ? 38 : 30}px${top ? ';fill:#ffd9b8' : ''}">${fmt(p.v)}</text>
      <text x="${p.x}" y="${p.y - 26}" text-anchor="middle" class="fl rise3">${p.l.toUpperCase()}</text>
      ${prev ? `<g class="rise3"><rect x="${(p.x + prev.x) / 2 - 34}" y="${(p.y + prev.y) / 2 + 12}" width="68" height="20" rx="10" fill="rgba(228,43,12,.16)" stroke="rgba(255,150,110,.45)"/><text x="${(p.x + prev.x) / 2}" y="${(p.y + prev.y) / 2 + 26}" text-anchor="middle" class="fp">↗ ${pctf(p.v, prev.v)}</text></g>` : ''}
      <rect x="${p.x - 100}" y="0" width="200" height="${G + 30}" fill="transparent"/></g>` }).join('')}
    ${plane(8, 0, 1, 1)}${plane(8, -4, .65, .55)}</svg>`;
}

/* ---------- source state ---------- */
function srcState(k) {
  const b = D[k] || {};
  if (API.includes(k)) return b.connected ? (b.error ? {c: 'err', t: 'Stale · ' + ago(b.synced_at)} : {c: 'live', t: 'Live'}) : b.error ? {c: 'err', t: 'Sync error'} : {c: 'off', t: 'Not connected'};
  return {c: 'man', t: 'Manual' + (b.updated ? ' · ' + dshort(b.updated) : '')};
}
const srcChip = k => { const s = srcState(k); return `<span class="chip ${s.c}"><i></i>${NAMES[k]} · ${s.t}</span>` };
const lastSync = k => API.includes(k) ? (D[k] || {}).synced_at ? ago(D[k].synced_at) : '—' : (D[k] || {}).updated ? dshort(D[k].updated) : '—';

/* ---------- building blocks ---------- */
const kpi = (label, val, sub, o = {}) => `<div class="glass kpi tilt ${o.accent ? 'accent' : ''}"><div class="kl">${label}</div><div class="kv">${val}</div><div class="ks">${sub || ''}</div>${o.id ? `<div class="spark" id="${o.id}"></div>` : ''}</div>`;
const panel = o => `<section class="glass panel s${o.span || 12} ${o.cls || ''}"><header class="ph"><div><h3>${o.title}</h3>${o.sub ? `<p>${o.sub}</p>` : ''}</div>${o.src ? srcChip(o.src) : ''}</header>${o.body}</section>`;
const empty = (msg, ep) => `<div class="empty"><b>${msg}</b>${ep ? `<code>${ep}</code>` : ''}</div>`;
const legend = items => `<div class="lg">${items.map(([l, c]) => `<span><i style="background:${c};color:${c}"></i>${l}</span>`).join('')}</div>`;
const hbars = (items, f = fmt) => { const m = Math.max(1, ...items.map(x => x[1] || 0));
  return `<div class="hb">${items.map(([l, v]) => `<div class="r"><span title="${esc(l)}">${esc(l)}</span><div class="bar"><i style="width:${100 * (v || 0) / m}%"></i></div><span>${f(v)}</span></div>`).join('')}</div>` };
const bar = (v, of) => `<div class="bar"><i style="width:${of ? Math.min(100, 100 * v / of) : 0}%"></i></div>`;

/* ---------- chart primitives (SVG, drawn at the container's real pixel size) ---------- */
function svg(el) { el.innerHTML = ''; const w = el.clientWidth || 600, h = el.clientHeight || 220;
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"></svg>`; return [el.firstChild, w, h] }
function smooth(p) { if (!p.length) return ''; let d = `M${p[0][0]},${p[0][1]}`;
  for (let i = 1; i < p.length; i++) { const [x0, y0] = p[i - 1], [x1, y1] = p[i], cx = (x0 + x1) / 2; d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}` } return d }
const nice = m => { if (m <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(m))), f = m / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p };
const axf = v => v >= 1000 ? (v / 1000).toFixed(v >= 1e4 ? 0 : 1) + 'k' : v % 1 ? v.toFixed(1) : String(v);

function spark(el, vals, color = C.sig) {
  if (!el) return; const [s, W, H] = svg(el), n = vals.length, m = Math.max(...vals, 1), flat = vals.every(v => !v);
  const p = vals.map((v, i) => [i * W / Math.max(1, n - 1), H - 3 - (v / m) * (H - 8)]), id = uid(), d = smooth(p);
  s.innerHTML = `<defs>${grad(id, color, .35, 0)}</defs>${flat ? '' : `<path d="${d} L${W},${H} L0,${H}Z" fill="url(#${id})"/>`}
    <path d="${d}" fill="none" stroke="${flat ? C.dim : color}" stroke-width="1.5" ${flat ? 'stroke-dasharray="2 4"' : ''}/>`;
}

/* time series: bar and line series share the day axis; axis:'r' puts a series on its own right scale */
function lines(el, dates, series) {
  const [s, W, H] = svg(el), hasR = series.some(x => x.axis === 'r'), L = 40, R = hasR ? 40 : 10, T = 12, B = 24, pw = W - L - R, ph = H - T - B, n = dates.length;
  const X = i => L + pw * (i + .5) / n, slot = pw / n, isDate = /^\d{4}-/.test(dates[0] || '');
  const mx = f => nice(Math.max(1, ...series.filter(f).flatMap(x => x.vals)));
  const lm = mx(x => x.axis !== 'r'), rm = mx(x => x.axis === 'r'), gid = uid();
  let g = `<defs>${glowF(gid, 3)}</defs>`;
  for (let k = 0; k <= 4; k++) { const y = T + ph - ph * k / 4;
    g += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 3}" text-anchor="end">${axf(lm * k / 4)}</text>`;
    if (hasR) g += `<text x="${W - R + 8}" y="${y + 3}">${axf(rm * k / 4)}</text>` }

/* ---------- derived numbers ---------- */
function M() {
  const i = D.instantly || {}, h = D.heyreach || {}, g = D.ghl || {}, c = i.campaigns || [], seller = g.seller || [], deal = g.deal || [];
  const reached = (arr, w) => { const k = arr.findIndex(s => s.stage.toLowerCase().includes(w)); return k < 0 ? 0 : sum(arr.slice(k), 'count') };
  return {sent: sum(c, 'sent'), contacted: sum(c, 'contacted'), inCamp: sum(c, 'in_campaign'), replies: sum(c, 'replies'), positive: sum(c, 'positive'),
    bounced: sum(c, 'bounced'), unsub: sum(c, 'unsubscribed'), liReq: h.requests_sent || 0, liAcc: h.accepted || 0, liMsg: h.messages_sent || 0,
    liRep: h.replies || 0, liViews: h.profile_views, inPlay: sum(Object.values((D.list || {}).in_play || {})),
    sOpen: sum(seller, 'count'), sVal: sum(seller, 'value'), dOpen: sum(deal, 'count'), dVal: sum(deal, 'value'),
    conv: reached(seller, 'conversation'), booked: reached(seller, 'discovery call booked'), held: reached(seller, 'discovery call held'),
    signed: reached(seller, 'signed'), closed: reached(seller, 'closed')};
}
const days = () => (D.instantly.daily || []).map(d => d.date);
const hrBy = k => { const m = Object.fromEntries((D.heyreach.daily || []).map(d => [d.date, d[k] || 0])); return days().map(d => m[d] || 0) };

/* ---------- pages ---------- */
function feed(n) { const a = (D.ghl || {}).activity || [];
  if (!a.length) return empty('Stage moves stream here as owners move through the pipeline');
  return `<div class="feed">${a.slice(0, n).map(x => `<div class="fi"><i></i><div><div>${esc(x.text)}</div><span>${ago(x.at)}</span></div></div>`).join('')}</div>` }

/* hub: the room in the middle, each source wired in; light travels only on live wires */
function hub() {
  const W = 1000, cx = 500, cy = 135, id = uid(), pos = [[180, 70], [180, 200], [820, 135]];
  const col = {live: '#ff6a3d', man: C.amber, err: '#ff4d4d', off: C.dim};
  const nodes = CATALOG.map((x, i) => { const s = srcState(x.k), [nx, ny] = pos[i % 3], left = nx < cx, ex = left ? nx + 95 : nx - 95, c = col[s.c] || C.dim;
    const d = `M${ex} ${ny} C${(ex + cx) / 2} ${ny} ${(ex + cx) / 2} ${cy} ${left ? cx - 62 : cx + 62} ${cy}`;
    return `<path d="${d}" fill="none" stroke="${c}" stroke-opacity="${s.c === 'off' ? .25 : .5}" stroke-width="1.6" ${s.c === 'off' ? 'stroke-dasharray="3 5"' : ''}/>
      ${s.c === 'live' || s.c === 'man' ? [0, 1].map(k => `<circle r="${s.c === 'live' ? 3.4 : 2.6}" fill="#fff" filter="url(#${id}g)"><animateMotion dur="${s.c === 'live' ? 2.6 : 5}s" begin="${k * (s.c === 'live' ? 1.3 : 2.5)}s" repeatCount="indefinite" path="${d}"/></circle>`).join('') : ''}
      <g data-tip="${x.name}<br>${s.t}"><rect x="${nx - 95}" y="${ny - 28}" width="190" height="56" rx="14" fill="rgba(255,255,255,.045)" stroke="${c}" stroke-opacity=".45"/>
      <circle cx="${nx - 68}" cy="${ny}" r="15" fill="url(#${id}${s.c === 'man' ? 'm' : s.c === 'live' ? 'o' : 'x'})" filter="url(#${id}g)"/>
      <text x="${nx - 68}" y="${ny + 4}" text-anchor="middle" style="fill:#fff;font-size:10px">${x.logo}</text>
      <text x="${nx - 44}" y="${ny - 3}" class="nn">${x.name}</text><text x="${nx - 44}" y="${ny + 13}" class="ns" style="fill:${c}">${esc(s.t)}</text></g>` }).join('');
  const live = CATALOG.filter(x => srcState(x.k).c === 'live').length;
  return `<svg viewBox="0 0 ${W} 270" preserveAspectRatio="xMidYMid meet"><defs>${glowF(id + 'g', 4)}
    <radialGradient id="${id}o" cx=".35" cy=".3"><stop offset="0" stop-color="#ffc4a8"/><stop offset=".5" stop-color="#e42b0c"/><stop offset="1" stop-color="#3d0c04"/></radialGradient>
    <radialGradient id="${id}m" cx=".35" cy=".3"><stop offset="0" stop-color="#ffe0b8"/><stop offset=".5" stop-color="#ff8a3d"/><stop offset="1" stop-color="#3d1d04"/></radialGradient>
    <radialGradient id="${id}x" cx=".35" cy=".3"><stop offset="0" stop-color="#777"/><stop offset="1" stop-color="#1a1817"/></radialGradient>
    <radialGradient id="${id}h"><stop offset="0" stop-color="#e42b0c" stop-opacity=".35"/><stop offset="1" stop-color="#e42b0c" stop-opacity="0"/></radialGradient></defs>
    <circle cx="${cx}" cy="${cy}" r="130" fill="url(#${id}h)"/>
    ${nodes}
    <circle cx="${cx}" cy="${cy}" r="78" fill="none" stroke="rgba(255,150,110,.25)" stroke-dasharray="2 7" class="spin"/>
    <circle cx="${cx}" cy="${cy}" r="66" fill="none" stroke="rgba(255,150,110,.4)" stroke-dasharray="40 14 4 14" class="spin r"/>
    <circle cx="${cx}" cy="${cy}" r="52" fill="url(#${id}o)" filter="url(#${id}g)"/>
    <circle cx="${cx}" cy="${cy}" r="52" fill="none" stroke="rgba(255,220,200,.5)"/>
    <text x="${cx}" y="${cy - 2}" text-anchor="middle" class="big" style="font-size:24px">N</text>
    <text x="${cx}" y="${cy + 18}" text-anchor="middle" style="fill:#ffd7c4;font-size:8.5px;letter-spacing:.14em">CONTROL ROOM</text>
    <text x="${cx}" y="${cy + 102}" text-anchor="middle" style="font-size:9.5px;letter-spacing:.1em">${live} OF ${CATALOG.length} SOURCES LIVE · DATA ${ago(D.generated_at).toUpperCase()}</text></svg>`;
}

function route() {
  const h = location.hash.slice(1), id = {crm: 'pipeline', tasks: 'pipeline', activity: 'pipeline'}[h] || h || 'overview',  // old links (alert emails point to #crm)
    p = PAGES.find(x => x.id === id) || PAGES[0];
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.id === p.id));
  $('#ptitle').textContent = p.label;
  let r; try { r = p.fn() } catch (e) { console.error(e); $('#view').innerHTML = `<div class="err">This view failed to render · ${esc(e.message)}</div>`; return }
  $('#view').innerHTML = r.html;
  document.querySelectorAll('#view .glass').forEach((e, i) => e.style.animationDelay = i * 35 + 'ms');
  CUR = r.draw; requestAnimationFrame(() => { try { r.draw() } catch (e) { console.error(e) } });
  $('#main').scrollTop = 0; window.scrollTo(0, 0);
  document.title = p.label + ' · Newton Control Room';
}

/* pointer: glass spotlight, KPI tilt, tooltips */
document.addEventListener('pointermove', e => {
  const c = e.target.closest && e.target.closest('.glass');
  if (c) { const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
    if (c.classList.contains('tilt')) { const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5; c.style.transform = `perspective(900px) rotateX(${-py * 7}deg) rotateY(${px * 9}deg)` } }
  const t = e.target.closest && e.target.closest('[data-tip]'), tip = $('#tip');
  if (!t) { tip.style.opacity = 0; return }
  tip.innerHTML = t.dataset.tip; tip.style.opacity = 1;
  let x = e.clientX + 14, y = e.clientY + 16; if (x + tip.offsetWidth > innerWidth - 8) x = e.clientX - tip.offsetWidth - 14; if (y + tip.offsetHeight > innerHeight - 8) y = e.clientY - tip.offsetHeight - 12;
  tip.style.transform = `translate(${x}px,${y}px)`;
});
document.addEventListener('pointerout', e => { const c = e.target.closest && e.target.closest('.tilt'); if (c && !c.contains(e.relatedTarget)) c.style.transform = '' });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => CUR && CUR(), 150) });

/* data.enc = data.json sealed with AES-GCM; key = PBKDF2(password). The key is remembered per browser. */
const b16 = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
const unhex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
async function derive(pw, E) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', hash: 'SHA-256', salt: b16(E.salt), iterations: E.iter}, base, {name: 'AES-GCM', length: 256}, true, ['decrypt']);
}
async function open_(E, key) {
  const ct = Uint8Array.from(atob(E.ct), c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b16(E.iv)}, key, ct)));
}
function start(d) { $('#gate').remove(); D = d; chrome(); route() }
fetch('data.enc?t=' + Date.now()).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json() }).then(async E => {
  let saved = null; try { saved = localStorage.getItem('ncr_key') } catch (e) {}
  if (saved) try { return start(await open_(E, await crypto.subtle.importKey('raw', b16(saved), 'AES-GCM', false, ['decrypt']))) } catch (e) {}
  $('#gf').addEventListener('submit', async ev => {
    ev.preventDefault(); const btn = $('#gf button'); btn.disabled = true; $('#gn').textContent = '';
    try {
      const key = await derive($('#gp').value, E), d = await open_(E, key);
      try { localStorage.setItem('ncr_key', unhex(await crypto.subtle.exportKey('raw', key))) } catch (e) {}
      start(d);
    } catch (e) { const g = $('#gate'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); $('#gn').textContent = 'Wrong password'; $('#gp').select(); btn.disabled = false }
  });
}).catch(e => { $('#gn').textContent = 'Could not load data · ' + e.message });
