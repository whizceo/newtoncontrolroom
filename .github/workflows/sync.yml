name: Live sync
# Fired every few minutes by the n8n server (always on). GitHub's own cron is only a backup: it is best-effort and often skips hours.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Pull Instantly + Newton CRM, seal into data.enc
        env:
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          HEYREACH_API_KEY: ${{ secrets.HEYREACH_API_KEY }}
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRM_LOGIN_EMAIL: ${{ secrets.CRM_LOGIN_EMAIL }}
          CRM_LOGIN_PASSWORD: ${{ secrets.CRM_LOGIN_PASSWORD }}
        run: python sync.py
      - name: Move owners to the stage their Instantly emails prove
        continue-on-error: true
        timeout-minutes: 8
        env:
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python stage_ai.py
      - name: Save snapshot to the repo
        run: |
          git config user.name "evolv-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data.enc stage_state.json
          git diff --cached --quiet || (git commit -m "sync: $(date -u +%FT%H:%MZ)" && git pull --rebase -X theirs -q && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
